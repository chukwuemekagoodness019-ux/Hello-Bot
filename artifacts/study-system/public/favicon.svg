<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark app background -->
  <rect width="512" height="512" rx="96" fill="#0b0f1a"/>

  <!-- Soft indigo ambient glow -->
  <circle cx="256" cy="240" r="210" fill="#6366f1" fill-opacity="0.09"/>

  <!-- ── GRADUATION CAP ── -->

  <!-- Mortarboard flat board (diamond, top face) -->
  <path d="M256 98 L424 194 L256 264 L88 194 Z" fill="#6366f1"/>

  <!-- Board top highlight (gives 3-D feel) -->
  <path d="M256 98 L424 194 L340 229 L256 162 Z" fill="#818cf8"/>

  <!-- Cap cylindrical body -->
  <path d="M156 213 L156 322 Q156 358 256 358 Q356 358 356 322 L356 213 L256 264 Z" fill="#4338ca"/>

  <!-- Body front face highlight -->
  <path d="M176 222 L176 318 Q176 348 256 348 Q280 348 300 344 L300 220 L256 264 Z" fill="#4f46e5"/>

  <!-- Bottom rim of cap -->
  <ellipse cx="256" cy="322" rx="100" ry="26" fill="#6366f1"/>

  <!-- ── TASSEL ── -->

  <!-- Tassel cord from board centre to right edge -->
  <path d="M256 98 L256 118 Q280 136 392 190" stroke="#c7d2fe" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Tassel button -->
  <circle cx="392" cy="190" r="15" fill="#c7d2fe"/>

  <!-- Tassel vertical drop -->
  <line x1="392" y1="205" x2="392" y2="368" stroke="#c7d2fe" stroke-width="8" stroke-linecap="round"/>

  <!-- Tassel fringe -->
  <line x1="375" y1="368" x2="368" y2="404" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="383" y1="368" x2="378" y2="408" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="392" y1="368" x2="392" y2="410" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="401" y1="368" x2="406" y2="408" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>
  <line x1="409" y1="368" x2="416" y2="404" stroke="#c7d2fe" stroke-width="6" stroke-linecap="round"/>

  <!-- ── SPARKLE accent (top-left) ── -->
  <path d="M146 162 L151 147 L156 162 L171 167 L156 172 L151 187 L146 172 L131 167 Z" fill="#a5b4fc"/>

  <!-- Smaller sparkle (bottom-right accent) -->
  <path d="M340 340 L343 332 L346 340 L354 343 L346 346 L343 354 L340 346 L332 343 Z" fill="#818cf8"/>
</svg>
