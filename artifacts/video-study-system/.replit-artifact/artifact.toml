kind = "video"
previewPath = "/video-study-system/"
title = "AI Study System - Video"
version = "1.0.0"
id = "artifacts/video-study-system"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/video-study-system/" ]
localPort = 22468

[services.development]
run = "pnpm --filter @workspace/video-study-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-study-system", "run", "build" ]
publicDir = "artifacts/video-study-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22468"
BASE_PATH = "/video-study-system/"
